name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  altair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix (PRs)
        if: github.ref != 'refs/heads/master'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}

      - name: Configure Cachix (master)
        if: github.ref == 'refs/heads/master'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build altair.dolphin-emu.org
        run: nix run nixpkgs#colmena -- build --on altair.dolphin-emu.org

  deneb:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix (PRs)
        if: github.ref != 'refs/heads/master'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}

      - name: Configure Cachix (master)
        if: github.ref == 'refs/heads/master'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build deneb.dolphin-emu.org
        run: nix run nixpkgs#colmena -- build --on deneb.dolphin-emu.org
