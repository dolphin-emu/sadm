name: Container Images

on:
  push:
    branches:
      - master
    paths:
      - containers/**
      - .github/workflows/containers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build ${{ matrix.image }} (x64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - appimage-builder
          - debian-builder
          - ubuntu-lts-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: oci-registry.dolphin-emu.org
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          tags: oci-registry.dolphin-emu.org/${{ matrix.image }}:latest
          push: true

  build-arm64:
    name: Build ${{ matrix.image }} (arm64)
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        image:
          - appimage-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: oci-registry.dolphin-emu.org
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          platforms: linux/arm64
          tags: oci-registry.dolphin-emu.org/${{ matrix.image }}-arm64:latest
          push: true
